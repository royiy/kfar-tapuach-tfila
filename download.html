<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>לוח זמנים להורדה – בית הכנסת המרכזי כפר תפוח</title>
    <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=Frank+Ruhl+Libre:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-navy: #0a1628;
            --royal-blue: #1e3a5f;
            --gold: #d4af37;
            --warm-gold: #f4e4c1;
            --cream: #faf8f3;
            --soft-white: #ffffff;
            --charcoal: #2a2a2a;
            --shadow-blue: rgba(30, 58, 95, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Alef', sans-serif;
            background: #e9e5db;
            color: var(--charcoal);
            padding: 24px 16px 60px;
        }

        /* ---------- סרגל הכלים (לא מודפס) ---------- */
        .toolbar {
            max-width: 210mm;
            margin: 0 auto 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            background: var(--deep-navy);
            border-radius: 14px;
            padding: 14px 20px;
            box-shadow: 0 8px 25px var(--shadow-blue);
        }
        .toolbar-title {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 20px;
            color: var(--warm-gold);
        }
        .toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            font-family: 'Alef', sans-serif;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            padding: 11px 22px;
            cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.25); }
        .btn-primary { background: var(--gold); color: var(--deep-navy); font-weight: 700; }

        .hint {
            max-width: 210mm;
            margin: 0 auto 20px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--royal-blue);
            text-align: center;
        }
        .hint.error { color: #b3261e; }

        /* ---------- הדף להדפסה ---------- */
        .sheet {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: var(--cream);
            box-shadow: 0 10px 40px rgba(0,0,0,.22);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sheet-hero {
            background: linear-gradient(165deg, var(--deep-navy) 0%, var(--royal-blue) 100%);
            border-bottom: 5px solid var(--gold);
            padding: 30px 30px 26px;
            text-align: center;
            color: var(--soft-white);
        }
        .sheet-title { font-family: 'Frank Ruhl Libre', serif; font-size: 38px; line-height: 1.2; }
        .sheet-location { font-family: 'Frank Ruhl Libre', serif; font-size: 21px; color: var(--warm-gold); margin-top: 4px; }
        .sheet-parsha {
            display: inline-block;
            margin-top: 18px;
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(212,175,55,.35);
            border-radius: 50px;
            padding: 8px 34px;
        }
        .sheet-parsha .label { font-size: 15px; color: var(--warm-gold); }
        .sheet-parsha .value { font-family: 'Frank Ruhl Libre', serif; font-size: 26px; margin-right: 8px; }

        .sheet-body {
            flex: 1;
            padding: 26px 30px 16px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .card {
            background: var(--soft-white);
            border-top: 4px solid var(--gold);
            border-radius: 14px;
            padding: 16px 22px 20px;
            box-shadow: 0 4px 14px var(--shadow-blue);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-bottom: 2px solid #f0ede3;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .card-title { font-family: 'Frank Ruhl Libre', serif; font-size: 25px; color: var(--royal-blue); }

        /* תפילות שבת – שתי עמודות: ערב שבת / יום השבת */
        .shabbat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 34px; }

        .section-title {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 20px;
            color: var(--royal-blue);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 5px;
            margin-bottom: 6px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 9px 2px;
            border-bottom: 1px solid #f5f2e8;
            font-size: 18px;
        }
        .row:last-child { border-bottom: none; }
        .time {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 19px;
            color: var(--royal-blue);
            background: #e8f2ff;
            border-radius: 7px;
            padding: 3px 14px;
            min-width: 76px;
            text-align: center;
            direction: ltr;
            flex-shrink: 0;
        }
        .row.emphasis {
            background: var(--warm-gold);
            border-right: 4px solid var(--gold);
            border-bottom: none;
            border-radius: 7px;
            padding: 9px 10px;
            margin: 5px 0;
        }
        .row.emphasis .label { font-weight: 700; color: var(--deep-navy); }
        .row.emphasis .time { background: var(--gold); color: var(--soft-white); font-weight: 700; }

        /* תפילות חול – ארבעה בלוקים בשורה */
        .weekday-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .weekday-block {
            background: #f9f5ff;
            border-right: 4px solid var(--gold);
            border-radius: 10px;
            padding: 12px 10px 14px;
            text-align: center;
        }
        .weekday-name {
            font-family: 'Frank Ruhl Libre', serif;
            color: var(--royal-blue);
            font-size: 19px;
            margin-bottom: 9px;
        }
        .pill {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 17px;
            color: var(--soft-white);
            background: var(--deep-navy);
            border-radius: 8px;
            padding: 4px 12px;
            margin: 4px 2px;
            display: block;
        }

        .sheet-quote {
            margin: 8px 30px 0;
            text-align: center;
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 21px;
            color: var(--royal-blue);
            border-top: 2px solid var(--gold);
            border-bottom: 2px solid var(--gold);
            padding: 12px 0;
        }

        .sheet-footer {
            background: var(--deep-navy);
            color: var(--warm-gold);
            text-align: center;
            padding: 13px 30px;
            margin-top: 18px;
            font-size: 15px;
        }

        /* ---------- הדפסה / שמירה כ-PDF ---------- */
        @page { size: A4 portrait; margin: 0; }
        @media print {
            body { background: var(--soft-white); padding: 0; }
            .toolbar, .hint { display: none !important; }
            .sheet {
                box-shadow: none;
                margin: 0;
                width: 210mm;
                height: 297mm;
                min-height: 0;
                page-break-after: avoid;
            }
            .card, .shiur-block, .weekday-block, .sheet-hero, .sheet-footer, .row.emphasis, .time, .pill {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .card, .weekday-block, .row { break-inside: avoid; }
        }

        @media (max-width: 240mm) {
            .sheet { width: 100%; max-width: 210mm; min-height: 0; }
        }
        @media (max-width: 700px) {
            body { padding: 14px 10px 40px; }
            .shabbat-grid { grid-template-columns: 1fr; gap: 6px; }
            .weekday-grid { grid-template-columns: 1fr 1fr; }
            .sheet-title { font-size: 30px; }
            .toolbar { flex-direction: column; align-items: stretch; text-align: center; }
            .toolbar-actions { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="toolbar-title">לוח זמני התפילות – להורדה והדפסה</div>
        <div class="toolbar-actions">
            <button class="btn btn-primary" onclick="window.print()">⬇️ הורדת PDF</button>
        </div>
    </div>

    <div class="hint" id="hint">
        בחלון שייפתח יש לבחור ביעד <strong>"שמירה כ-PDF"</strong> ואז ללחוץ שמירה.
    </div>

    <div class="sheet" id="sheet">
        <header class="sheet-hero">
            <div class="sheet-title">בית הכנסת המרכזי</div>
            <div class="sheet-location">כפר תפוח</div>
            <div class="sheet-parsha">
                <span class="label">פרשת השבוע</span>
                <span class="value" id="parsha-name">טוען...</span>
            </div>
        </header>

        <div class="sheet-body">
            <section class="card">
                <div class="card-header"><span>🕍</span><h2 class="card-title">תפילות שבת</h2></div>
                <div class="shabbat-grid">
                    <div>
                        <div class="section-title">ערב שבת</div>
                        <div id="erev-shabbat-times"></div>
                    </div>
                    <div>
                        <div class="section-title">יום השבת</div>
                        <div id="shabbat-day-times"></div>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="card-header"><span>✨</span><h2 class="card-title">תפילות חול</h2></div>
                <div class="weekday-grid" id="weekday-times"></div>
            </section>
        </div>

        <div class="sheet-quote">וּתְשׁוּבָה וּתְפִלָּה וּצְדָקָה מַעֲבִירִין אֶת רוֹעַ הַגְּזֵרָה</div>

        <footer class="sheet-footer">
            בית הכנסת המרכזי כפר תפוח
        </footer>
    </div>

    <script>
        const DEFAULT_SHACHARIT_SHABBAT = '08:00';
        const DEFAULT_DRASHA_TITLE = 'דרשת הרב';
        let jsonData = {};

        /* ---------- עזרים ---------- */
        function addMinutesToTimeStr(timeStr, mins) {
            const parts = String(timeStr).split(':');
            if (parts.length < 2) return timeStr;
            const h = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            if (isNaN(h) || isNaN(m)) return timeStr;
            const total = (h * 60 + m + mins + 24 * 60) % (24 * 60);
            return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function rowHtml(label, time, emphasis) {
            if (!time) return '';
            return '<div class="row' + (emphasis ? ' emphasis' : '') + '">' +
                   '<span class="label">' + escapeHtml(label) + '</span>' +
                   '<span class="time">' + escapeHtml(time) + '</span></div>';
        }

        /* ---------- הצגת הנתונים ---------- */
        function renderShabbat() {
            const st = jsonData.shabbat_times || {};
            const erev = st.erev_shabbat || {};
            const day = st.shabbat_day || {};

            let erevHtml = '';
            erevHtml += rowHtml('מנחה גדולה', erev.mincha_gedola);
            erevHtml += rowHtml('קבלת שבת מוקדמת', erev.kablat_shabbat_mukdemet);
            erevHtml += rowHtml('הדלקת נרות', erev.candle_lighting);
            erevHtml += rowHtml('מנחה ערב שבת',
                erev.mincha_erev_shabbat || (erev.candle_lighting ? addMinutesToTimeStr(erev.candle_lighting, 14) : ''));
            erevHtml += rowHtml('צאת הכוכבים', erev.tzeit_hakochavim);
            document.getElementById('erev-shabbat-times').innerHTML = erevHtml;

            let dayHtml = '';
            dayHtml += rowHtml('שחרית', day.shacharit || DEFAULT_SHACHARIT_SHABBAT);
            dayHtml += rowHtml('מנחה גדולה', day.mincha_gedola);
            dayHtml += rowHtml('מנחה של שבת',
                day.mincha_shabbat || (day.tzeit_shabbat ? addMinutesToTimeStr(day.tzeit_shabbat, -130) : ''));
            // דרשת/שיעור הרב – נשלט מ-data.json, כמחרוזת שעה או כאובייקט {title, time}
            if (day.drasha) {
                const drasha = (typeof day.drasha === 'string') ? { time: day.drasha } : day.drasha;
                dayHtml += rowHtml(drasha.title || DEFAULT_DRASHA_TITLE, drasha.time, true);
            }
            dayHtml += rowHtml('שקיעה', day.shkiya);
            dayHtml += rowHtml('צאת שבת וערבית', day.tzeit_shabbat);
            document.getElementById('shabbat-day-times').innerHTML = dayHtml;
        }

        function renderWeekday() {
            const wt = jsonData.weekday_times || {};
            const blocks = [
                ['סליחות', wt.selichot],
                ['שחרית', wt.shacharit],
                ['מנחה', wt.mincha],
                ['ערבית', wt.arvit]
            ];
            let html = '';
            blocks.forEach(function (block) {
                const name = block[0], times = block[1];
                if (!times || !times.length) return;
                html += '<div class="weekday-block"><div class="weekday-name">' + name + '</div>' +
                        times.map(function (t) { return '<span class="pill">' + escapeHtml(t) + '</span>'; }).join('') +
                        '</div>';
            });
            document.getElementById('weekday-times').innerHTML = html;
        }

        function renderAll() {
            document.getElementById('parsha-name').textContent = jsonData.parsha || '';
            renderShabbat();
            renderWeekday();
        }

        async function loadDataFromJson() {
            try {
                const response = await fetch('./data.json?v=' + Date.now());
                if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
                jsonData = await response.json();
                renderAll();
            } catch (error) {
                console.error('Error loading data.json:', error);
                const hint = document.getElementById('hint');
                hint.textContent = 'שגיאה בטעינת הזמנים. נסו לרענן את העמוד.';
                hint.classList.add('error');
                document.getElementById('parsha-name').textContent = 'שגיאה בטעינה';
            }
        }

        loadDataFromJson();
    </script>
</body>
</html>
